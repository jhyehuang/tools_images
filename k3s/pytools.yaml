apiVersion: v1
kind: Namespace
metadata:
  name: pytools
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pytools
  namespace: pytools
  labels:
    app: pytools
spec:
  replicas: 1
  # hostPath + 单副本：Recreate 避免滚动更新时新旧 Pod 同时占住目录
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: pytools
  template:
    metadata:
      labels:
        app: pytools
    spec:
      # 数据在多节点上时，把 Pod 钉到持有数据的那个节点。
      # 单节点 k3s 不需要，留着会导致 Pending，所以默认注释掉。
      # nodeSelector:
      #   kubernetes.io/hostname: <节点名>   # kubectl get nodes
      containers:
        - name: pytools
          image: pytools:3.12
          # 镜像是 k3s ctr images import 导入的，本地已有就别去网上拉
          imagePullPolicy: IfNotPresent
          command: ["/bin/bash", "-c", "sleep infinity"]
          workingDir: /work
          env:
            - name: TZ
              value: Asia/Shanghai
            - name: DATA_DIR
              value: /data
          volumeMounts:
            - name: data
              mountPath: /data
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              # 跑 pandas 之类的大内存脚本时按需调大
              memory: 4Gi
      volumes:
        - name: data
          hostPath:
            # ⚠️ 改成 k3s 节点上的真实路径（Linux 路径，不是 Mac 上的）
            #    先用 kubectl get nodes 确认 Pod 落在哪个节点
            path: /data/pytools
            # 目录不存在会自动建，但建出来是空的
            type: DirectoryOrCreate
