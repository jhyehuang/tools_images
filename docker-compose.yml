services:
  pytools:
    build:
      context: .
      dockerfile: Dockerfile
      # 全部留空 = 用 Dockerfile 里的默认值（已经是国内镜像）。
      # 想换回官方源就设成官方地址，例如 APT_MIRROR=deb.debian.org
      args:
        APT_MIRROR: ${APT_MIRROR:-}
        PIP_INDEX_URL: ${PIP_INDEX_URL:-}
        JMETER_MIRROR: ${JMETER_MIRROR:-}
        MAVEN_MIRROR: ${MAVEN_MIRROR:-}
        MC_MIRROR: ${MC_MIRROR:-}
        AWS_MIRROR: ${AWS_MIRROR:-}
        JMETER_VERSION: ${JMETER_VERSION:-}
        JMETER_PLUGINS_MANAGER: ${JMETER_PLUGINS_MANAGER:-}
    image: pytools:3.12
    container_name: pytools
    # 故意不写 platform：写了会强制按那个架构找镜像，架构不一致的机器上
    # 会匹配不到本地镜像、转而去 registry 拉。交叉构建才需要，那时加回：
    #   platform: ${TARGET_PLATFORM:-linux/amd64}
    working_dir: /work
    volumes:
      # 宿主目录 → 容器 /data，用 HOST_DATA_DIR 覆盖
      - ${HOST_DATA_DIR:-./data}:/data
    environment:
      TZ: Asia/Shanghai
      DATA_DIR: /data
    tty: true
    stdin_open: true
    command: ["bash"]
