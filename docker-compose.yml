services:
  pytools:
    build:
      context: .
      dockerfile: Dockerfile
      # 全部留空 = 用 Dockerfile 里的默认值（已经是国内镜像）。
      # 想换回官方源就设成官方地址，例如 APT_MIRROR=deb.debian.org
      args:
        APT_MIRROR: ${APT_MIRROR:-}
        PIP_INDEX_URL: ${PIP_INDEX_URL:-}
        JMETER_MIRROR: ${JMETER_MIRROR:-}
        MAVEN_MIRROR: ${MAVEN_MIRROR:-}
        MC_MIRROR: ${MC_MIRROR:-}
        AWS_MIRROR: ${AWS_MIRROR:-}
        JMETER_VERSION: ${JMETER_VERSION:-}
        JMETER_PLUGINS_MANAGER: ${JMETER_PLUGINS_MANAGER:-}
    image: pytools:3.12
    container_name: pytools
    # 本机默认 arm64；服务器上：TARGET_PLATFORM=linux/amd64 docker compose build
    platform: ${TARGET_PLATFORM:-linux/arm64}
    working_dir: /work
    volumes:
      # 宿主目录 → 容器 /data，用 HOST_DATA_DIR 覆盖
      - ${HOST_DATA_DIR:-./data}:/data
    environment:
      TZ: Asia/Shanghai
      DATA_DIR: /data
    tty: true
    stdin_open: true
    command: ["bash"]
